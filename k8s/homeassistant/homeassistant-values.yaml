name: homeassistant

secrets:
  enabled: false

persistentVolumeClaims:
  - name: homeassistant-config
    storage: 5Gi
  - name: homeassistant-matter
    storage: 1Gi
  - name: homeassistant-otbr
    storage: 1Gi

services:
  - name: homeassistant
    spec:
      type: ClusterIP
      ports:
        - appProtocol: http
          port: 80
          targetPort: http
      selector:
        app: homeassistant
  - name: matter-server
    spec:
      type: ClusterIP
      ports:
        - appProtocol: http
          port: 5580
          targetPort: matter
      selector:
        app: matter-server
  - name: otbr
    spec:
      type: ClusterIP
      ports:
        - appProtocol: http
          port: 8081
          targetPort: otbr-rest
      selector:
        app: otbr

deployments:
  - name: homeassistant
    replicas: 1
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
        - name: homeassistant-config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:stable
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Stockholm
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              nelyah.eu/zigbee: 1
            limits:
              nelyah.eu/zigbee: 1
          volumeMounts:
            - mountPath: /config
              name: homeassistant-config
            - mountPath: /etc/localtime
              name: localtime
              readOnly: true
          ports:
            - containerPort: 8123
              name: http

  - name: matter-server
    replicas: 1
    podAnnotations:
      container.apparmor.security.beta.kubernetes.io/matter-server: unconfined
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: homeassistant-matter
          persistentVolumeClaim:
            claimName: homeassistant-matter
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:stable
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/Stockholm
          volumeMounts:
            - mountPath: /data
              name: homeassistant-matter
          ports:
            - containerPort: 5580
              name: matter

  - name: otbr
    replicas: 1
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: home-stockholm
      volumes:
        - name: homeassistant-otbr
          persistentVolumeClaim:
            claimName: homeassistant-otbr
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      containers:
        - name: otbr
          image: openthread/border-router@sha256:6e4a0993a897f36f53bd9cc86626b14e0bf3643281559c24663efb67ca054595
          imagePullPolicy: IfNotPresent
          env:
            - name: OT_RCP_DEVICE
              value: spinel+hdlc+uart:///dev/thread?uart-baudrate=460800
            - name: OT_INFRA_IF
              value: enp1s0
            - name: OT_THREAD_IF
              value: wpan0
            - name: OT_LOG_LEVEL
              value: "5"
            - name: OT_REST_LISTEN_ADDR
              value: 0.0.0.0
            - name: OT_REST_LISTEN_PORT
              value: "8081"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
              drop:
                - ALL
            privileged: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              nelyah.eu/thread: 1
            limits:
              cpu: 500m
              memory: 256Mi
              nelyah.eu/thread: 1
          volumeMounts:
            - mountPath: /data
              name: homeassistant-otbr
            - mountPath: /dev/net/tun
              name: tun
          ports:
            - containerPort: 8081
              name: otbr-rest
          startupProbe:
            tcpSocket:
              port: otbr-rest
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: otbr-rest
            periodSeconds: 10
