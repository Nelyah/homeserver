apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        homeserver.nelyah.eu/image-refresh: "false"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
{{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: device-plugin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DEVICE_PLUGIN_RESOURCE_NAME
              value: {{ .Values.device.resourceName | quote }}
            - name: DEVICE_PLUGIN_DEVICE_ID
              value: {{ .Values.device.id | quote }}
            - name: DEVICE_PLUGIN_HOST_PATH
              value: {{ .Values.device.hostPath | quote }}
            - name: DEVICE_PLUGIN_HEALTH_PATH
              value: {{ .Values.device.healthPath | quote }}
            - name: DEVICE_PLUGIN_CONTAINER_PATH
              value: {{ .Values.device.containerPath | quote }}
            - name: DEVICE_PLUGIN_SOCKET_NAME
              value: {{ .Values.device.socketName | quote }}
            - name: DEVICE_PLUGIN_LOCK_NAME
              value: {{ .Values.device.lockName | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          resources:
{{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: host-dev
              mountPath: /host-dev
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
